name: Coletar fontes

# Roda às 7h15 de Brasília (10h15 UTC), antes da rotina de curadoria das 8h.
# Grava coleta/AAAA-MM-DD.json em main. Push feito com GITHUB_TOKEN não dispara o "Publicar e notificar".
on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Coletar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/coletar.py
      - name: Commitar
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add coleta
          git diff --cached --quiet && exit 0
          git commit -m "coleta $(TZ=America/Sao_Paulo date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
